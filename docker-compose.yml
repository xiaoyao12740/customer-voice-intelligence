services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: voc_platform
      MYSQL_USER: voc_user
      MYSQL_PASSWORD: voc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8005
    environment:
      DATABASE_URL: mysql+pymysql://voc_user:voc_password@mysql:3306/voc_platform
    ports: ["8005:8005"]
    depends_on:
      mysql: {condition: service_healthy}
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8505 --server.address=0.0.0.0
    environment:
      DATABASE_URL: mysql+pymysql://voc_user:voc_password@mysql:3306/voc_platform
      API_URL: http://api:8005
    ports: ["8505:8505"]
    depends_on: [api]
volumes:
  mysql_data:
